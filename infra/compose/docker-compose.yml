# ==============================================================================
# ForeTrade OS — Production Docker Compose Orchestration
# Bridges PostgreSQL, Redis, FastAPI Backend, and Next.js 16 Web Cockpit
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: foretrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foretrade}
      POSTGRES_USER: ${POSTGRES_USER:-foretrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foretrade-secure-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: foretrade-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.api
    container_name: foretrade-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-foretrade}:${POSTGRES_PASSWORD:-foretrade-secure-password}@postgres:5432/${POSTGRES_DB:-foretrade}
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
    container_name: foretrade-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
