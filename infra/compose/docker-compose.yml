services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foretrade}
      POSTGRES_USER: ${POSTGRES_USER:-foretrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foretrade-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5433:5432"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["6379:6379"]
  minio:
    image: quay.io/minio/aistor/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foretrade}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-foretrade-local-only}
    ports: ["9000:9000", "9001:9001"]
  api:
    build: { context: ../.., dockerfile: infra/compose/Dockerfile.api }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-foretrade}:${POSTGRES_PASSWORD:-foretrade-local-only}@postgres:5432/${POSTGRES_DB:-foretrade}
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000
    volumes: ["uploads:/data/uploads"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: { context: ../.., dockerfile: infra/compose/Dockerfile.web }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  uploads:



