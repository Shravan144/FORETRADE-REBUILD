[project]
name = "foretrade-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "email-validator>=2.0,<3.0",
  "fastapi>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<4.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]
[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<10.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
